services:
  - type: web
    name: pegguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: COINGECKO_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
